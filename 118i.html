<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2012 BMW 118i Sport Line</title>

<style>
body{margin:0;background:#111;color:white;font-family:"Microsoft JhengHei",Arial,sans-serif}
.wrap{max-width:960px;margin:auto;padding:18px}
.back{display:block;color:white;text-decoration:none;font-size:20px;margin-bottom:18px}
h1{font-size:34px;margin:8px 0 10px}
.price{font-size:42px;color:#FFD700;font-weight:bold;margin-bottom:12px}
.desc{font-size:22px;color:#ddd;line-height:1.8;margin-bottom:18px}
.photo{background:#000;border-radius:18px;overflow:hidden}
.photo img{width:100%;height:520px;object-fit:contain;background:#000;display:block}
.count{text-align:center;color:#FFD700;font-size:22px;margin:12px 0}
.controls{display:flex;gap:12px;margin-bottom:20px}
.controls button{flex:1;padding:15px;background:#FFD700;color:#000;border:0;border-radius:12px;font-size:20px;font-weight:bold}
.box{background:#1b1b1b;border:1px solid #333;border-radius:16px;padding:22px;margin:18px 0}
.box h2{font-size:30px;margin:0 0 15px;border-left:5px solid #FFD700;padding-left:12px}
.box li{font-size:22px;line-height:2}
.float{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px}
.float a{color:white;text-decoration:none;padding:12px 18px;border-radius:40px;font-weight:bold;text-align:center}
@media(max-width:600px){.photo img{height:330px}h1{font-size:30px}.price{font-size:38px}}
</style>
</head>
<body>

<div class="wrap">
<a class="back" href="index.html">← 返回車庫首頁</a>

<h1>2012 BMW 118i Sport Line</h1>

<div class="price">售價：16.8萬</div>

<div class="desc">
里程僅7萬公里｜M包｜安卓機｜不可認證
</div>

<div class="photo">
<img id="carPhoto">
</div>

<div class="count" id="counter"></div>

<div class="controls">
<button onclick="prevPhoto()">← 上一張</button>
<button onclick="nextPhoto()">下一張 →</button>
</div>

<div class="box">
<h2>重點配備</h2>
<ul>
<li>雙前跑車座椅</li>
<li>中控大螢幕</li>
<li>倒車影像</li>
<li>電動腰靠調整</li>
<li>卡夢內飾板</li>
</ul>
</div>

<div class="box">
<h2>升級項目</h2>
<ul>
<li>全車M包</li>
<li>安卓機</li>
<li>雙色下巴</li>
<li>黑鼻頭</li>
</ul>
</div>

<div class="box">
<h2>車況說明</h2>
<ul>
<li>里程僅7萬公里</li>
<li>右前葉子板曾有傷</li>
<li>已處理完成</li>
<li>不可認證</li>
<li>歡迎現場賞車試車</li>
</ul>
</div>
</div>

<div class="float">
<a href="tel:0928661002" style="background:#25D366;">📞 電話</a>
<a href="https://line.me/ti/p/uOXzpqw-wV" target="_blank" style="background:#06C755;">LINE</a>
<a href="https://www.instagram.com/soooong.08" target="_blank" style="background:#E1306C;">IG</a>
</div>

<script>
const photos=[
"images/bmw-118i-2012/01.jpeg",
"images/bmw-118i-2012/02.jpeg",
"images/bmw-118i-2012/03.jpeg",
"images/bmw-118i-2012/04.jpeg",
"images/bmw-118i-2012/05.jpeg",
"images/bmw-118i-2012/06.jpeg",
"images/bmw-118i-2012/07.jpeg",
"images/bmw-118i-2012/08.jpeg",
"images/bmw-118i-2012/09.jpeg",
"images/bmw-118i-2012/10.jpeg"
];

let i=0;
const img=document.getElementById("carPhoto");
const counter=document.getElementById("counter");

function show(){
img.src=photos[i];
counter.innerText=(i+1)+" / "+photos.length;
}
function nextPhoto(){i=(i+1)%photos.length;show();}
function prevPhoto(){i=(i-1+photos.length)%photos.length;show();}
show();
</script>

</body>
</html>
