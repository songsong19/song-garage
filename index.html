<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小宋車庫｜誠信買賣</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

header{
    background:#000;
    text-align:center;
    padding:25px;
}

.container{
    width:95%;
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.car-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.car-card{
    background:#1a1a1a;
    border-radius:15px;
    overflow:hidden;
}

.car-card img{
    width:100%;
    height:240px;
    object-fit:cover;
}

.car-info{
    padding:15px;
}

.price{
    color:#FFD700;
    font-size:24px;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin-top:10px;
    background:#FFD700;
    color:black;
    text-decoration:none;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🚗 小宋車庫｜誠信買賣</h1>
<p>實車實價・SAVE認證・全台服務</p>
</header>

<div class="container">

<div class="car-grid">

<div class="car-card">

<img src="images/c43-amg-2016/01.jpeg">

<div class="car-info">

<h2>2016 Mercedes-Benz C43 AMG</h2>

<div class="price">
售價：100萬
</div>

<a class="btn" href="c43.html">
查看詳情
</a>

</div>

</div>

</div>

</div>

</body>
</html>
