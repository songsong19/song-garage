<script>
function showCarPayment(){
let payment=document.getElementById("carSelect").value;

if(payment===""){
document.getElementById("carPaymentResult").style.display="none";
return;
}

document.getElementById("carPaymentResult").style.display="block";
document.getElementById("carPaymentText").innerText="最低月付 "+payment+" 元起";
}

function calculateLoan(){
let price=parseFloat(document.getElementById("carPrice").value);
let down=parseFloat(document.getElementById("downPayment").value) || 0;
let months=parseInt(document.getElementById("months").value);
let rate=parseFloat(document.getElementById("rate").value);

if(!price || price<=0){
alert("請輸入車價");
return;
}

let loanAmount=(price-down)*10000;

if(loanAmount<=0){
alert("頭期款不能大於或等於車價");
return;
}

let monthlyRate=rate/100/12;
let monthly=loanAmount*monthlyRate/(1-Math.pow(1+monthlyRate,-months));

document.getElementById("result").style.display="block";
document.getElementById("monthlyPayment").innerText="月付參考：約 "+Math.round(monthly).toLocaleString()+" 元";
document.getElementById("loanDetail").innerHTML=
"車價："+price+" 萬<br>"+
"頭期款："+down+" 萬<br>"+
"貸款金額：約 "+Math.round(loanAmount).toLocaleString()+" 元<br>"+
"期數："+months+" 期<br>"+
"年利率："+rate+"%";
}
</script>
